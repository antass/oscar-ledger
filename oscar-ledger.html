<title>The Oscar Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a theatre programme. Marquee header with your season totals, then four tabs:
   a poster wall of every nominated film, the 24 categories, a ballot, and next season. */
:root {
  --bg: #fbf7f5;          /* programme paper, faint rose */
  --surface: #ffffff;
  --sunk: #f2eae6;
  --fg: #2b1016;          /* oxblood ink */
  --muted: #7a5f63;
  --line: #e4d6d1;
  --gold: #9a6d14;        /* gilt, darkened for paper */
  --gold-soft: #f3e5c4;
  --curtain: #8f1d2c;
  --seen: #2f6b4f;
  --seen-soft: #dcefe4;
  --poster-fg: #f8eedd;
  --poster-gold: #e4c372;
  --shadow: 0 1px 2px rgb(43 16 22 / .06), 0 8px 24px -12px rgb(43 16 22 / .25);
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #160a0d; --surface: #21100f; --sunk: #1b0c0f; --fg: #f4e7da; --muted: #b59a92;
    --line: #3a2124; --gold: #dcb660; --gold-soft: #3a2a12; --curtain: #d04456;
    --seen: #6fc59a; --seen-soft: #173326;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 10px 30px -14px rgb(0 0 0 / .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #160a0d; --surface: #21100f; --sunk: #1b0c0f; --fg: #f4e7da; --muted: #b59a92;
  --line: #3a2124; --gold: #dcb660; --gold-soft: #3a2a12; --curtain: #d04456;
  --seen: #6fc59a; --seen-soft: #173326;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 10px 30px -14px rgb(0 0 0 / .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 0 64px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* Marquee */
.marquee { padding-block: 36px 24px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px 40px; align-items: end; border-bottom: 1px solid var(--line); }
.eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.marquee h1 { font: italic 600 clamp(40px, 7vw, 76px)/.95 var(--display); letter-spacing: -.02em; margin-top: 10px; }
.marquee h1 span { font-style: normal; font-weight: 800; }
.marquee p { color: var(--muted); margin: 12px 0 0; max-width: 54ch; }
.tally { display: flex; gap: 28px; flex-wrap: wrap; }
.tally div { display: grid; gap: 4px; min-width: 88px; }
.tally b { font: 600 34px/1 var(--display); font-variant-numeric: lining-nums tabular-nums; }
.tally b small { font-size: 16px; color: var(--muted); font-weight: 400; }
.tally span { font: 500 10.5px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.meter { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--gold); transition: width .5s ease; }

/* Tabs */
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; gap: 4px; overflow-x: auto; padding-block: 10px; border-bottom: 1px solid var(--line); scrollbar-width: none; }
nav.tabs button { border: 0; background: none; padding: 8px 14px; border-radius: 999px; font-weight: 500; color: var(--muted); white-space: nowrap; }
nav.tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); }
nav.tabs .sync { margin-left: auto; align-self: center; font: 11px var(--mono); color: var(--muted); white-space: nowrap; padding-left: 12px; }

section.view { padding-top: 24px; }

/* Up next */
.upnext { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 20px; align-items: center; padding: 16px 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin-bottom: 22px; }
.upnext h2 { font: italic 600 22px/1.1 var(--display); }
.upnext .picks { display: flex; gap: 8px; flex-wrap: wrap; }
.upnext button { border: 1px solid var(--line); background: var(--sunk); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; }
.upnext button em { font-style: normal; color: var(--muted); font: 11px var(--mono); margin-left: 6px; }
.upnext button:hover { border-color: var(--gold); }

/* Controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 13.5px; }
.chip[aria-pressed="true"] { background: var(--gold-soft); border-color: var(--gold); color: var(--fg); font-weight: 600; }
.chip .n { font: 11px var(--mono); color: var(--muted); margin-left: 4px; }
.search { flex: 1 1 200px; min-width: 0; max-width: 300px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; }
select.sort { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; }

/* Poster wall */
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 18px; }
.poster { position: relative; aspect-ratio: 2 / 3; max-width: 100%; border: 0; padding: 14px 13px 12px; border-radius: 6px; text-align: left; color: var(--poster-fg); display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow); transition: transform .18s ease, box-shadow .18s ease;
  background:
    repeating-conic-gradient(from 0deg at 50% 118%, rgb(255 255 255 / .045) 0 4deg, transparent 4deg 9deg),
    linear-gradient(165deg, hsl(var(--h) 42% 30%), hsl(var(--h) 55% 11%) 75%); }
.poster:hover { transform: translateY(-3px); }
.poster::after { content: ""; position: absolute; inset: 6px; border: 1px solid rgb(228 195 114 / .35); border-radius: 3px; pointer-events: none; }
.poster .count { font: 500 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--poster-gold); }
.poster .t { font: 600 clamp(19px, 2.1vw, 23px)/1.05 var(--display); margin-top: auto; text-wrap: balance; overflow-wrap: anywhere; }
.poster .d { font-size: 11.5px; opacity: .78; margin-top: 6px; line-height: 1.3; }
.poster .wins { display: flex; gap: 2px; margin-top: 10px; min-height: 18px; color: var(--poster-gold); align-items: flex-end; }
.poster .wins svg { width: 8px; height: 18px; }
.poster .kind { position: absolute; top: 12px; right: 12px; font: 500 9.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; opacity: .7; }
.poster.seen { outline: 2px solid var(--seen); outline-offset: 3px; }
.stamp { position: absolute; top: 34px; right: -30px; transform: rotate(32deg); background: var(--seen); color: #fff; font: 600 10px/1 var(--mono); letter-spacing: .14em; padding: 5px 34px; text-transform: uppercase; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; grid-column: 1 / -1; }

/* Categories */
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
.cat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 16px 10px; min-width: 0; }
.cat header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.cat h3 { font: 600 19px/1.15 var(--display); }
.cat .prog { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
.cat.done .prog { color: var(--seen); font-weight: 500; }
.nom { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); align-items: start; }
.nom:first-of-type { border-top: 0; }
.tick { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; padding: 0; display: grid; place-items: center; margin-top: 1px; }
.tick svg { width: 12px; height: 12px; opacity: 0; }
.tick.on { background: var(--seen); border-color: var(--seen); color: #fff; }
.tick.on svg { opacity: 1; }
.nom .who { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
.nom .who .film-link { font-weight: 600; background: none; border: 0; padding: 0; text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.nom .who .film-link:hover { text-decoration-color: var(--gold); }
.nom .cr { color: var(--muted); font-size: 12.5px; line-height: 1.35; margin-top: 2px; }
.nom.win .who::after { content: "WINNER"; font: 600 9.5px/1 var(--mono); letter-spacing: .12em; color: var(--gold); border: 1px solid var(--gold); border-radius: 3px; padding: 2px 5px; margin-left: 8px; vertical-align: 2px; }

/* Ballot */
.ballot-bar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; padding: 16px 18px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 18px; }
.ballot-bar p { margin: 0; color: var(--muted); max-width: 60ch; }
.ballot-bar .score { font: 600 28px/1 var(--display); }
.btn { border: 1px solid var(--fg); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.pick { width: 100%; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 8px 0; }
.pick:first-of-type { border-top: 0; }
.radio { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--muted); margin-top: 2px; }
.pick[aria-checked="true"] .radio { border: 5px solid var(--curtain); }
.pick.won .who { color: var(--gold); }
.pick .tag { font: 600 9.5px/1 var(--mono); letter-spacing: .12em; margin-left: 6px; padding: 2px 5px; border-radius: 3px; vertical-align: 2px; }
.pick .tag.ok { background: var(--seen-soft); color: var(--seen); }
.pick .tag.ac { border: 1px solid var(--gold); color: var(--gold); }
.cat.agree { border-color: var(--seen); }

/* Next season */
.next-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; min-width: 0; }
.panel h2 { font: italic 600 26px/1.1 var(--display); margin-bottom: 6px; }
.panel > p { color: var(--muted); margin: 0 0 16px; }
.count-row { display: flex; gap: 28px; flex-wrap: wrap; margin-bottom: 18px; }
.count-row b { display: block; font: 600 48px/1 var(--display); font-variant-numeric: lining-nums tabular-nums; }
.count-row span { font: 500 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
ol.timeline { list-style: none; margin: 0; padding: 0; }
ol.timeline li { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
ol.timeline li.past { color: var(--muted); }
ol.timeline li.next-up span:last-child { font-weight: 600; }
ol.timeline li.next-up span:first-child { color: var(--curtain); }
.add-row { display: flex; gap: 8px; margin-bottom: 12px; }
.add-row input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 12px; }
.contender { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.contender .x { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 2px 6px; }
.contender.seen span { text-decoration: line-through; color: var(--muted); }

/* Film sheet */
dialog.sheet { border: 0; padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); border-radius: 12px; background: var(--surface); color: var(--fg); box-shadow: 0 30px 80px -20px rgb(0 0 0 / .6); }
dialog.sheet::backdrop { background: rgb(22 10 13 / .55); backdrop-filter: blur(2px); }
.sheet-hero { padding: 22px 22px 18px; color: var(--poster-fg); position: relative;
  background: repeating-conic-gradient(from 0deg at 50% 140%, rgb(255 255 255 / .05) 0 4deg, transparent 4deg 9deg), linear-gradient(165deg, hsl(var(--h) 42% 30%), hsl(var(--h) 55% 11%)); }
.sheet-hero h2 { font: 600 32px/1.05 var(--display); margin-top: 8px; padding-right: 30px; }
.sheet-hero .meta { font-size: 13px; opacity: .85; margin-top: 6px; }
.sheet-hero .close { position: absolute; top: 12px; right: 12px; border: 0; background: rgb(255 255 255 / .12); color: var(--poster-fg); width: 32px; height: 32px; border-radius: 50%; font-size: 18px; }
.sheet-body { padding: 18px 22px 22px; display: grid; gap: 18px; }
.sheet-body .log { margin: 0; font-size: 15.5px; }
.watch-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.seen-btn { border: 1.5px solid var(--seen); color: var(--seen); background: transparent; border-radius: 999px; padding: 8px 16px; font-weight: 600; }
.seen-btn[aria-pressed="true"] { background: var(--seen); color: #fff; }
.stars { display: flex; gap: 2px; }
.stars button { border: 0; background: none; font-size: 22px; line-height: 1; padding: 2px; color: var(--line); }
.stars button.on { color: var(--gold); }
.sheet-body label { font: 500 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px; }
.sheet-body textarea { width: 100%; min-height: 70px; resize: vertical; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 12px; }
.sheet-noms { display: grid; gap: 0; }
.sheet-noms div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
.sheet-noms div:first-child { border-top: 0; }
.sheet-noms small { color: var(--muted); display: block; font-size: 12.5px; }
.sheet-noms .w { font: 600 9.5px/1 var(--mono); letter-spacing: .12em; color: var(--gold); align-self: center; }
.links { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; }
.links a { color: var(--curtain); font-weight: 600; text-underline-offset: 3px; }
.badge { display: inline-block; font: 500 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; border: 1px solid rgb(228 195 114 / .5); color: var(--poster-gold); padding: 4px 7px; border-radius: 3px; margin-right: 6px; }

.seasons { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; margin-bottom: 16px; background: var(--surface); }
.seasons button { border: 0; background: none; border-radius: 999px; padding: 6px 14px; display: flex; gap: 6px; align-items: baseline; color: var(--muted); }
.seasons b { font: 600 15px/1 var(--display); }
.seasons span { font: 11px var(--mono); }
.seasons button[aria-pressed="true"] { background: var(--curtain); color: #fff; }
.seasons button[aria-pressed="true"] span { color: rgb(255 255 255 / .75); }
h3.sub { font: 600 17px/1.2 var(--display); margin: 22px 0 10px; }
.crow { display: grid; grid-template-columns: 22px 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.crow:first-child { border-top: 0; }
.crow .rk { font: 500 13px var(--mono); color: var(--gold); text-align: right; }
.crow .film-link { background: none; border: 0; padding: 0; text-align: left; font-weight: 600; font-size: 15px; }
.crow .film-link:hover { text-decoration: underline; text-decoration-color: var(--gold); text-underline-offset: 3px; }
.crow .cr { color: var(--muted); font-size: 12.5px; }
.tier { font: 600 9.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 3px 6px; border-radius: 3px; white-space: nowrap; }
.tier.likely { background: var(--gold-soft); color: var(--gold); }
.tier.alt { border: 1px solid var(--line); color: var(--muted); }
.tier.bubble { border: 1px dashed var(--line); color: var(--muted); }
.crow.seen .film-link { color: var(--muted); }
footer.note { margin-top: 40px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 16px; }

@media (max-width: 760px) {
  .marquee { grid-template-columns: minmax(0, 1fr); }
  .next-grid { grid-template-columns: minmax(0, 1fr); }
  .cats { grid-template-columns: minmax(0, 1fr); }
  .upnext { grid-template-columns: minmax(0, 1fr); }
  .wall { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
  .wrap { padding-inline: 16px; }
  nav.tabs .sync { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="marquee">
    <div>
      <div class="seasons" role="group" aria-label="Ceremony" id="seasons">
        <button data-season="97"><b>97th</b><span>2025</span></button>
        <button data-season="98"><b>98th</b><span>2026</span></button>
        <button data-season="99"><b>99th</b><span>2027</span></button>
      </div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1>The Oscar <span>Ledger</span></h1>
      <p id="lede"></p>
    </div>
    <div class="tally" id="tally"></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" id="tab-films" data-view="films" aria-selected="true">Films</button>
    <button role="tab" id="tab-cats" data-view="cats" aria-selected="false">Categories</button>
    <button role="tab" id="tab-ballot" data-view="ballot" aria-selected="false">Your ballot</button>
    <button role="tab" id="tab-next" data-view="next" aria-selected="false" hidden>Contenders</button>
    <span class="sync" id="sync">Saved on this device</span>
  </nav>

  <section class="view" id="view-films">
    <div class="upnext" id="upnext"></div>
    <div class="controls">
      <div class="chips" id="filters"></div>
      <input class="search" id="q" type="search" placeholder="Search films or people" aria-label="Search films or people">
      <select class="sort" id="sort" aria-label="Sort films">
        <option value="noms">Most nominated</option>
        <option value="wins">Most wins</option>
        <option value="az">A to Z</option>
        <option value="rating">My rating</option>
      </select>
    </div>
    <div class="wall" id="wall"></div>
  </section>

  <section class="view" id="view-cats" hidden>
    <div class="controls"><div class="chips" id="catfilters"></div></div>
    <div class="cats" id="cats"></div>
  </section>

  <section class="view" id="view-ballot" hidden>
    <div class="ballot-bar" id="ballotbar"></div>
    <div class="cats" id="ballot"></div>
  </section>

  <section class="view" id="view-next" hidden>
    <div class="next-grid">
      <div class="panel">
        <h2>Most likely contenders</h2>
        <p>The films pundits expect to be nominated, ranked by Best Picture odds. Nothing is official until January 21. Watch these early and you'll be ahead of the season.</p>
        <div id="contenders"></div>
        <h3 class="sub">Your own additions</h3>
        <form class="add-row" id="addform">
          <input id="addtitle" placeholder="Add a 2026 film you've heard about" aria-label="Film title" maxlength="80" autocomplete="off">
          <button class="btn" type="submit">Add</button>
        </form>
        <div id="mine"></div>
      </div>
      <div class="panel" id="countdown"></div>
    </div>
  </section>

  <footer class="note" id="footnote"></footer>
</div>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>

<script>
/* ---------- Data: 98th Academy Awards (March 15, 2026) ---------- */
// k: feature | animated | doc | short ; h: poster hue ; fam: family night tag
const F98 = {
  oba:{t:"One Battle After Another",d:"Paul Thomas Anderson",k:"feature",h:28,l:"A burned-out ex-revolutionary is dragged back into the fight when an old enemy resurfaces and his daughter goes missing. Based loosely on Thomas Pynchon's Vineland."},
  sin:{t:"Sinners",d:"Ryan Coogler",k:"feature",h:356,l:"Twin brothers return to 1930s Mississippi to open a juke joint, and the music draws something evil to the door. Record 16 nominations."},
  fra:{t:"Frankenstein",d:"Guillermo del Toro",k:"feature",h:205,l:"Del Toro's take on Mary Shelley: Victor Frankenstein and the Creature he brings to life, and abandons."},
  mar:{t:"Marty Supreme",d:"Josh Safdie",k:"feature",h:14,l:"A fast-talking 1950s New York hustler chases glory in professional table tennis."},
  sen:{t:"Sentimental Value",d:"Joachim Trier",k:"feature",h:220,l:"Two sisters and the filmmaker father who left them, reunited when he wants one of them to star in his comeback film."},
  ham:{t:"Hamnet",d:"Chloé Zhao",k:"feature",h:110,l:"Agnes, wife of William Shakespeare, and the loss of their son, from Maggie O'Farrell's novel."},
  bug:{t:"Bugonia",d:"Yorgos Lanthimos",k:"feature",h:150,l:"Two conspiracy-obsessed men kidnap a powerful CEO, convinced she is an alien. A remake of Save the Green Planet!"},

function norm(o) {
  o = o && typeof o === "object" ? o : {};

  if (Object.keys(p).some(k => !SEASONS[k])) p = { "98": p }; // first version stored 98th picks flat
  return { w: o.w || {}, p, x: Array.isArray(o.x) ? o.x : [] };
}

let ref = null, timer = null, writing = false, again = false, dirty = false;
const syncEl = document.getElementById("sync");
function save() {
  dirty = true;
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
  if (!ref) return;
  clearTimeout(timer);
  syncEl.textContent = "Saving…";
  timer = setTimeout(flush, 700);
}
async function flush() {
  if (writing) { again = true; return; }
  writing = true;
  try { await ref.set(JSON.parse(JSON.stringify(S))); syncEl.textContent = "Saved to your account"; }
  catch (e) { syncEl.textContent = "Couldn't save online · kept on this device"; }
  writing = false; dirty = false;
  if (again) { again = false; flush(); }
}
(async function connect() {
  try {
    const c = window.claude;
    if (!c || !c.use) return;
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    ref = db.doc("data/users/" + id + "/state");
    let first = true;
    ref.onSnapshot(snap => {
      if (snap.metadata.hasPendingWrites || dirty || writing) return;
      if (snap.exists) { S = norm(JSON.parse(JSON.stringify(snap.data()))); renderAll(); }
      else if (first && (Object.keys(S.w).length || Object.keys(S.p).length || S.x.length)) { flush(); } // carry device progress up
      first = false;
      syncEl.textContent = "Saved to your account";
    }, () => { syncEl.textContent = "Saved on this device"; });
  } catch (e) {}
})();

}

    $("tally").innerHTML = rows.map(([a, b, l]) => `<div><b>${a}<small> / ${b}</small></b><div class="meter"><i style="width:${pct(a, b)}"></i></div><span>${l}</span></div>`).join("")
      + `<div><b>${Math.max(daysTo("2027-01-21"), 0)}</b><div class="meter"><i style="width:0"></i></div><span>Days to nominations</span></div>`;

  const feats = FID.filter(f => FILMS[f].k !== "short");

  $("tally").innerHTML = rows.map(([a, b, l]) => `<div><b>${a}<small> / ${b}</small></b><div class="meter"><i style="width:${pct(a, b)}"></i></div><span>${l}</span></div>`).join("");

  const F = FILMS[f];

function renderWall() {

    wins: (a, b) => winsOf(b) - winsOf(a) || nomsOf(b) - nomsOf(a),
    az: (a, b) => FILMS[a].t.replace(/^(The|A) /, "").localeCompare(FILMS[b].t.replace(/^(The|A) /, "")),
    rating: (a, b) => ((S.w[b] || {}).r || 0) - ((S.w[a] || {}).r || 0) || nomsOf(b) - nomsOf(a)
  };
  list.sort(by[ui.sort]);

    return `<article class="cat${ok ? " agree" : ""}"><header><h3>${c.n}</h3><span class="prog">${p === undefined ? "No pick" : "Picked"}</span></header>
      <div role="radiogroup" aria-label="${c.n}">${c.m.map((m, i) => `<button class="pick${rev && m[3] ? " won" : ""}" role="radio" aria-checked="${p === i}" data-cat="${c.id}" data-i="${i}">
        <span class="radio"></span><span><span class="who">${nomHead(m)}${rev && m[3] ? (p === i ? '<span class="tag ok">YOU AGREED</span>' : '<span class="tag ac">WINNER</span>') : ""}</span>
        <span class="cr" style="display:block">${m[1] ? esc(FILMS[m[0]].t) : esc(m[2])}${seen(m[0]) ? " · seen" : ""}</span></span></button>`).join("")}</div></article>`;
  }).join("");
}

/* ---------- 99th: contenders + countdown ---------- */
function renderNext() {
  const nomD = daysTo("2027-01-21"), cerD = daysTo("2027-03-14");
  const nextIdx = NEXT.findIndex(([d]) => daysTo(d) >= 0);
  $("countdown").innerHTML = `<div class="eyebrow">Road to March 14, 2027</div>
    <h2 style="margin-top:8px">The next envelopes</h2>
    <p>On January 21, ask Claude to load the real nominees. This list becomes a full season like the 97th and 98th.</p>
    <div class="count-row">
      <div><b>${Math.max(nomD, 0)}</b><span>days to nominations</span></div>
      <div><b>${Math.max(cerD, 0)}</b><span>days to the ceremony</span></div>
    </div>
    <ol class="timeline">${NEXT.map(([d, e], i) => `<li class="${daysTo(d) < 0 ? "past" : i === nextIdx ? "next-up" : ""}">
      <span class="mono">${new Date(d + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })}</span><span>${esc(e)}</span></li>`).join("")}</ol>`;
  const order = Object.keys(F99).sort((a, b) => (F99[a].r || 99) - (F99[b].r || 99) || (F99[a].dr || 99) - (F99[b].dr || 99));
  $("contenders").innerHTML = order.map(f => {
    const F = F99[f], sn = seen(f);
    const by = [F.d, F.dist].filter(Boolean).join(" · ");
    return `<div class="crow${sn ? " seen" : ""}">
      <button class="tick${sn ? " on" : ""}" data-tick="${f}" aria-pressed="${sn}" aria-label="Mark ${esc(F.t)} as ${sn ? "not seen" : "seen"}">${CHECK}</button>
      <span class="rk">${F.r ? "#" + F.r : "–"}</span>
      <div><button class="film-link" data-film="${f}">${esc(F.t)}</button>${by ? `<div class="cr">${esc(by)}</div>` : ""}</div>
      <span class="tier ${F.tier}">${TIER[F.tier]}</span></div>`;
  }).join("");
  $("mine").innerHTML = S.x.length ? S.x.map((x, i) => `<div class="contender${x.s ? " seen" : ""}">
      <button class="tick${x.s ? " on" : ""}" data-ctick="${i}" aria-pressed="${!!x.s}" aria-label="Mark ${esc(x.t)} as seen">${CHECK}</button>
      <span>${esc(x.t)}</span><button class="x" data-cdel="${i}" aria-label="Remove ${esc(x.t)}">×</button></div>`).join("")
    : `<p class="cr" style="color:var(--muted);margin:0">Heard buzz about something not on the list? Add it here.</p>`;
}

/* ---------- Film sheet ---------- */
const sheet = $("sheet");
let sheetFilm = null;
function openSheet(f) {
  sheetFilm = f;
  const F = FILMS[f], st = S.w[f] || {}, n = nomsOf(f), w = winsOf(f);
  const q = encodeURIComponent(F.t);
  const isC = F.y === "99";
  const badge = isC ? `<span class="badge">${TIER[F.tier]}</span>` : `<span class="badge">${SEASONS[F.y].n}</span><span class="badge">${n} nom${n > 1 ? "s" : ""} · ${w} win${w === 1 ? "" : "s"}</span>`;
  const pred = isC ? [F.r ? `Best Picture: predicted #${F.r}` : "", F.dr ? `Best Director: predicted #${F.dr} (${esc(F.d)})` : "", !F.r && !F.dr ? "Gold Derby lists it among the films competing for the last Best Picture spots" : ""].filter(Boolean) : [];
  sheet.innerHTML = `<div class="sheet-hero" style="--h:${F.h}">
      <button class="close" data-close aria-label="Close">×</button>
      <div>${badge}${KIND[F.k] ? `<span class="badge">${KIND[F.k]}</span>` : ""}${F.fam ? `<span class="badge">${famLabel[F.fam]}</span>` : ""}</div>
      <h2 id="sheet-title">${esc(F.t)}</h2>
      ${F.d || F.dist ? `<div class="meta">${F.d ? (F.k === "short" ? "" : "Directed by ") + esc(F.d) : ""}${F.d && F.dist ? " · " : ""}${F.dist ? esc(F.dist) : ""}</div>` : ""}
    </div>
    <div class="sheet-body">
      ${F.l ? `<p class="log">${esc(F.l)}</p>` : ""}
      <div class="watch-row">
        <button class="seen-btn" id="seenbtn" aria-pressed="${!!st.s}">${st.s ? "Seen" + (st.d ? " · " + new Date(st.d + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "") : "Mark as seen"}</button>
        <div class="stars" role="group" aria-label="Your rating">${[1, 2, 3, 4, 5].map(i => `<button data-star="${i}" class="${(st.r || 0) >= i ? "on" : ""}" aria-label="${i} star${i > 1 ? "s" : ""}" aria-pressed="${st.r === i}">★</button>`).join("")}</div>
      </div>
      <div><label for="note">Your notes</label><textarea id="note" placeholder="Who you watched with, what stuck with you…">${esc(st.n || "")}</textarea></div>
      ${isC ? `<div><label>Where it stands</label><div class="sheet-noms">${pred.map(p => `<div><span>${p}<small>Prediction as of fall 2026, not a nomination</small></span></div>`).join("")}</div></div>`
            : `<div><label>Nominations</label><div class="sheet-noms">${NOMS[f].map(x => `<div><span>${esc(x.c.n)}<small>${x.m[1] ? esc(x.m[1]) + " " : ""}${esc(x.m[2])}</small></span>${x.m[3] ? '<span class="w">WON</span>' : ""}</div>`).join("")}</div></div>`}
      <div class="links"><a href="https://www.justwatch.com/us/search?q=${q}" target="_blank" rel="noopener">Where to watch ↗</a><a href="https://letterboxd.com/search/films/${q}/" target="_blank" rel="noopener">Letterboxd ↗</a></div>
    </div>`;
  if (!sheet.open) sheet.showModal();
}
sheet.addEventListener("click", e => {
  if (e.target === sheet || e.target.closest("[data-close]")) { sheet.close(); return; }
  const f = sheetFilm; if (!f) return;
  if (e.target.closest("#seenbtn")) { setFilm(f, { s: !seen(f) }); openSheet(f); renderAll(true); }
  const star = e.target.closest("[data-star]");
  if (star) { const r = +star.dataset.star; setFilm(f, { r: (S.w[f] || {}).r === r ? 0 : r, s: true }); openSheet(f); renderAll(true); }
});
sheet.addEventListener("input", e => {
  if (e.target.id === "note" && sheetFilm) { setFilm(sheetFilm, { n: e.target.value.slice(0, 2000) }); }
});
sheet.addEventListener("close", () => { sheetFilm = null; });

/* ---------- Wiring ---------- */
function renderAll(keepSheet) {
  renderTally();
  if (cer === "99") renderNext();
  else { renderFilters(); renderUpNext(); renderWall(); renderCats(); renderBallot(); }
  if (!keepSheet && sheetFilm && sheet.open && document.activeElement?.id !== "note") openSheet(sheetFilm);
}
function show(view) {
  if (cer === "99") view = "next";
  else if (view === "next") view = "films";
  ui.view = view; saveUi();
  document.querySelectorAll("nav.tabs [data-view]").forEach(b => { b.setAttribute("aria-selected", b.dataset.view === view); b.hidden = (cer === "99") !== (b.dataset.view === "next"); });
  document.querySelectorAll("section.view").forEach(s => s.hidden = s.id !== "view-" + view);
}
function setSeason(y, view) {
  cer = SEASONS[y] ? y : "98"; ui.cer = cer;
  CATS = SEASONS[cer].cats; FID = Object.keys(SEASONS[cer].films);
  document.querySelectorAll("[data-season]").forEach(b => b.setAttribute("aria-pressed", b.dataset.season === cer));
  $("eyebrow").textContent = SEASONS[cer].eyebrow;
  $("lede").textContent = SEASONS[cer].lede;
  $("footnote").textContent = SEASONS[cer].foot + " Streaming links open JustWatch and Letterboxd searches.";
  renderAll();
  show(view || (cer === "99" ? "next" : ui.view));
}
document.querySelector("nav.tabs").addEventListener("click", e => { const b = e.target.closest("[data-view]"); if (b) show(b.dataset.view); });
$("seasons").addEventListener("click", e => { const b = e.target.closest("[data-season]"); if (b) setSeason(b.dataset.season); });
document.addEventListener("click", e => {
  if (e.target.closest("dialog")) return;
  const film = e.target.closest("[data-film]"); if (film) { openSheet(film.dataset.film); return; }
  const fc = e.target.closest("[data-f]"); if (fc) { ui.filter = fc.dataset.f; saveUi(); renderFilters(); renderWall(); return; }
  const cf = e.target.closest("[data-cf]"); if (cf) { ui.catf = cf.dataset.cf; saveUi(); renderCats(); return; }
  const tk = e.target.closest("[data-tick]"); if (tk) { setFilm(tk.dataset.tick, { s: !seen(tk.dataset.tick) }); renderAll(); return; }
  const pk = e.target.closest("[data-cat]"); if (pk) { const P = picks(), c = pk.dataset.cat, i = +pk.dataset.i; if (P[c] === i) delete P[c]; else P[c] = i; save(); renderBallot(); return; }
  if (e.target.closest("#reveal")) { ui.reveal[cer] = !ui.reveal[cer]; saveUi(); renderBallot(); return; }
  if (e.target.closest("#clearpicks")) { const b = e.target.closest("#clearpicks"); if (b.dataset.confirm) { S.p[cer] = {}; save(); renderBallot(); } else { b.dataset.confirm = 1; b.textContent = "Tap again to clear"; } return; }
  const ct = e.target.closest("[data-ctick]"); if (ct) { const x = S.x[+ct.dataset.ctick]; x.s = !x.s; save(); renderNext(); return; }
  const cd = e.target.closest("[data-cdel]"); if (cd) { S.x.splice(+cd.dataset.cdel, 1); save(); renderNext(); return; }
});
$("addform").addEventListener("submit", e => {
  e.preventDefault();
  const t = $("addtitle").value.trim(); if (!t) return;
  S.x.unshift({ t: t.slice(0, 80), s: false }); $("addtitle").value = ""; save(); renderNext(); renderTally();
});
$("q").value = ui.q;
$("q").addEventListener("input", e => { ui.q = e.target.value; renderWall(); });
$("sort").value = ui.sort;
$("sort").addEventListener("change", e => { ui.sort = e.target.value; saveUi(); renderWall(); });

const hash = location.hash.slice(1);
setSeason(["97", "98", "99"].includes(hash) ? hash : hash === "next" ? "99" : ui.cer, ["cats", "ballot", "films"].includes(hash) ? hash : null);
</script>
